name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 用 8.0.x 跟踪最新 8.0 补丁版本；固定 8.0.0 会因该 SDK 已下架导致 404
          dotnet-version: 8.0.x

      - name: Publish portable
        run: dotnet publish ElasticBreath.App/ElasticBreath.App.csproj -c Release -p:PublishProfile=Portable -o ./publish

      - name: Verify publish output
        shell: pwsh
        run: Get-ChildItem -Path ./publish -Recurse | Select-Object FullName

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ElasticBreath-portable-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ElasticBreath-portable-${{ github.ref_name }}.zip
          body: |
            ## ElasticBreath ${{ github.ref_name }}

            ### 运行要求 / Requirements

            | 项目 | 要求 |
            |---|---|
            | 操作系统 | Windows 10 / 11 64-bit (x64) |
            | 运行时 | **.NET 8 Desktop Runtime (x64)** —— 必需，本包不含运行时 |

            本包是**框架依赖（framework-dependent）**的单文件便携版，未内置 .NET 运行时，首次运行前需先安装
            **.NET 8 Desktop Runtime (x64)**（不是 ASP.NET Core Runtime，也不是仅 SDK）：

            - 下载：<https://dotnet.microsoft.com/download/dotnet/8.0> → “.NET Desktop Runtime 8.x” → Windows x64
            - 或命令行：`winget install Microsoft.DotNet.DesktopRuntime.8`
            - 校验：`dotnet --list-runtimes` 输出中应包含 `Microsoft.WindowsDesktop.App 8.x`

            缺运行时时双击 `ElasticBreath.App.exe` 会提示需要 .NET，程序本身不会联网下载任何东西。

            ### 使用 / Usage

            下载 `ElasticBreath-portable-${{ github.ref_name }}.zip`，解压到任意目录（建议固定路径），双击 `ElasticBreath.App.exe`。
            不写注册表、不需要管理员权限；配置存于程序目录下 `config/settings.json`，崩溃日志写入 `%TEMP%\ElasticBreath\crash\`，均不上传。

            ### 变更 / Changes

            见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
