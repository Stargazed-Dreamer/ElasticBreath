name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.0

      - name: Restore
        run: dotnet restore ElasticBreath.sln

      - name: Build
        run: dotnet build ElasticBreath.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ElasticBreath.sln --configuration Release --no-build --verbosity normal
